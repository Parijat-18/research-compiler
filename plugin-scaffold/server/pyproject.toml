[project]
name = "paper-compiler-mcp"
version = "0.1.0"
description = "MCP server bundled with the paper-compiler Claude Code plugin."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_compiler_mcp"]
