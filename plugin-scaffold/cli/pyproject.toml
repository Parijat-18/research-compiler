[project]
name = "paper-compiler-cli"
version = "0.1.0"
description = "CLI compiler for the paper-compiler Claude Code plugin."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "tenacity>=8.2",
  "rich>=13.7",
  "anthropic>=0.40",
  "pylatexenc>=2.10",
  "bibtexparser>=1.4",
  "tiktoken>=0.7",
  "tomli>=2.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
pdf = [
  "marker-pdf>=0.2.17",
]
indexes = [
  "rank-bm25>=0.2.2",
  "sentence-transformers>=2.7",
  "numpy>=1.26",
]
graph = [
  "sqlite-vec>=0.1.6",
  "networkx>=3.2",
]
full = [
  "paper-compiler-cli[pdf,indexes,graph]",
]

[project.scripts]
paper-compiler = "paper_compiler_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_compiler_cli"]
